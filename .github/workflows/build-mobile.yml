name: Build Mobile

on:
  workflow_dispatch: # 1. 手動実行用トリガーを追加
  pull_request:
  push:
    branches: [main, 'release/*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build-sign-ios:
    name: Build and sign iOS
    runs-on: macos-15 # 2. Xcode 16 環境を利用

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Show available Xcode versions
        run: ls /Applications | grep -i xcode

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # 3. 公式の immich-app/devtools/actions/use-mise をパブリックアクションに差し替え
      - name: Setup Mise
        uses: jdx/mise-action@v2
        with:
          working_directory: ./mobile

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: ./mobile/ios

      # 公式の依存関係インストール処理
      - name: Install dependencies
        run: mise //mobile:install:ci

      # 公式のコード生成処理
      - name: Perform codegen
        run: mise //mobile:codegen

      # 4. 公式の Apple 証明書設定・Fastlane ステップを未署名 IPA ビルドに置換
      - name: Build Unsigned IPA
        working-directory: ./mobile
        run: flutter build ipa --release --no-codesign

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-ipa
          path: mobile/build/ios/archive/Runner.xcarchive